<!doctype html>
<html>
  <head>
    <title>My First Page - VideoGames</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="scripts.js"></script>
    <script src="games.js"></script>
  </head>
  <body>
    <header>
      <div id="logo">OUR LOGO HERE</div>
      <nav>
        <ul>
          <li>
            <a href="index.html"><button class="button">Homepage</button></a>
          </li>
          <li>
            <a href="index2.html"><button class="button">Page 2!</button></a>
          </li>
          <li>
            <button class="button" id="theme-toggle">Toggle Theme</button>
          </li>
        </ul>
      </nav>
    </header>

    <div class="wrapping-div">
      <h1>Hi, I'm Julian</h1>
      <p>My favorite game is League of Legends.</p>
      <img src="" alt="Beautiful puppy" id="random-dog" />

      <h3>The last 3 games I played were</h3>

      <form class="form" action="javascript:void(0);">
        <div class="filters">
          <label for="search">Search Game!</label>
          <input
            type="text"
            name="search"
            id="search"
            placeholder="Game name here..."
          />
          <label for="genre">Choose a game genre:</label>
          <select name="genre" id="genre-dropdown">
            <option value="all">Show all games!</option>
          </select>
        </div>
        <div>
          <button class="button" id="game-loader" type="submit">
            Load Games!
          </button>
          <div id="list"></div>
        </div>
      </form>

      <br />

      <button id="count-btn" class="button">Plus 1!</button>
      <p>Clicks: <span id="count-display">0</span></p>
    </div>
  </body>
</html>
